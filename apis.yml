description: >-
  Sabanto is an agricultural autonomy company known for retrofitting existing
  farm tractors and equipment with an autonomy kit and an autonomy-as-a-service
  model, enabling unmanned tillage, planting, and field operations. It was
  surfaced as a portfolio company of DCVC and added to the API Evangelist
  network as a stub for enrichment. As of the enrichment pass on 2026-07-21 the
  company's primary domain (sabanto.com) no longer resolves to a live site — it
  redirects to a GoDaddy parked/for-sale page — so no developer portal, API,
  documentation, SDK, GitHub organization, or other public API surface could be
  found. This profile is retained as a lead with no live API surface at this
  time.
